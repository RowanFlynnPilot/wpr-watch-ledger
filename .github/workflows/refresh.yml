name: refresh-and-deploy

# Weekly data refresh: the ONLY thing that queries Overpass/EOF/Atlas.
# Runs Mondays 08:00 UTC (3 AM Central) — off the European midday peak that
# 504s overpass-api.de — plus manual dispatch. Site-code pushes deploy via
# deploy.yml without touching the pipeline.
#
# The single bounded retry below is workflow-level orchestration for a flaky
# shared server, not pipeline logic: refresh.py itself remains one-path and
# fails loudly, and if both attempts fail this run fails loudly too while the
# site keeps serving the last committed data.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data (one 15-minute-backoff retry)
        run: |
          pip install -r pipeline/requirements.txt
          python pipeline/refresh.py || {
            echo "First attempt failed; backing off 15 minutes before the only retry."
            sleep 900
            python pipeline/refresh.py
          }

      - name: Commit refreshed data
        run: |
          git config user.name "watch-ledger-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: weekly refresh $(date -u +%F)"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
